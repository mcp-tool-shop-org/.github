# Local usage:
#   lychee --config lychee.toml **/*.md

accept = [200, 429]
timeout = 20
max_concurrency = 8

# Exclude domains with known SSL/DNS issues
exclude = [
  "^https://www\\.npmjs\\.com",  # npm serves 403 to non-browser clients; package existence is verified by CI publish jobs
  "mcptoolshop\\.com",  # SSL hostname mismatch — domain config pending
  "^mailto:",
  "codeclone-suite",  # repo renamed/private — pending README cleanup
]

# GitHub auto-generated release notes configuration
# Inherited by all repos in mcp-tool-shop-org that don't define their own.
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - "skip-changelog"
      - "dependencies"
    authors:
      - "dependabot"
      - "dependabot[bot]"
  categories:
    - title: "Breaking Changes"
      labels:
        - "breaking"
        - "breaking-change"
    - title: "New Features"
      labels:
        - "enhancement"
        - "feature"
    - title: "Bug Fixes"
      labels:
        - "bug"
        - "fix"
        - "bugfix"
    - title: "Performance"
      labels:
        - "performance"
        - "perf"
    - title: "Security"
      labels:
        - "security"
    - title: "Documentation"
      labels:
        - "documentation"
        - "docs"
    - title: "CI / Infrastructure"
      labels:
        - "ci"
        - "github-actions"
        - "infrastructure"
    - title: "Other Changes"
      labels:
        - "*"

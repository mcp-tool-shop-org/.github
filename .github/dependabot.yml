# Org-wide Dependabot configuration
# Inherited by all repos in mcp-tool-shop-org that don't define their own.
#
# Scope: GitHub Actions only. Ecosystem deps (npm/pip/NuGet) are managed
# per-repo to avoid PR noise. Actions updates are low-volume, high-value
# (security patches, runner compatibility).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 3
    groups:
      # Minor + patch only, so a breaking major still opens as its OWN PR.
      all-github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # npm / site: SECURITY updates only. `open-pull-requests-limit: 0` switches OFF
  # version updates for this ecosystem, so this adds no routine PR volume -- it
  # exists purely to GROUP the security PRs GitHub opens regardless of config.
  #
  # Security updates fire even with no matching `updates:` entry, and a `groups:`
  # block only applies to VERSION updates unless it sets `applies-to:
  # security-updates`. Ungrouped, every advisory against the shared
  # site/package-lock.json opens its own PR; those PRs all rewrite that one
  # lockfile, so they conflict with each other and every merge forces the rest to
  # rebase. Coupled peers (astro + sharp) have to move together or the
  # `npm ci` in pages.yml resolves an inconsistent tree. Grouping clears them in
  # a single PR.
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      site-security:
        applies-to: security-updates
        patterns: ["*"]

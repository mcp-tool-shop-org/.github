title: "Idea: "
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      placeholder: What problem does this address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed idea
      placeholder: Describe the feature or improvement.

  - type: textarea
    id: users
    attributes:
      label: Who benefits?

  - type: textarea
    id: downsides
    attributes:
      label: Possible downsides

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

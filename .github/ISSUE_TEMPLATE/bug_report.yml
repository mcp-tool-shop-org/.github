name: Bug report
description: Report something that broke
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include what you expected to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs / stack trace
      render: shell
  - type: input
    attributes:
      label: OS
      placeholder: "Windows 11 23H2 / macOS 14 / Ubuntu 22.04"
  - type: input
    attributes:
      label: Runtime + version
      placeholder: "Node 20.x / Python 3.12 / .NET 8"

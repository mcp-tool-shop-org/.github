name: Org Drift Guard

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  check-org-standards:
    name: Check Org Standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check for forbidden 'master' branch references in workflows
        shell: bash
        run: |
          echo "=== Checking for 'master' branch references in .github repo workflows ==="
          violations=0

          for f in .github/workflows/*.yml; do
            # Skip this workflow itself
            [ "$(basename "$f")" = "org-guard.yml" ] && continue

            if grep -n 'branches:.*master' "$f" 2>/dev/null; then
              echo "::warning file=$f::Found 'master' branch reference — use 'main' instead"
              violations=$((violations + 1))
            fi
          done

          if [ "$violations" -gt 0 ]; then
            echo "::warning::Found $violations workflow(s) referencing 'master' branch"
          else
            echo "All workflows use 'main' branch references"
          fi

      - name: Check action version floors
        shell: bash
        run: |
          echo "=== Checking action version floors ==="
          warnings=0

          for f in .github/workflows/*.yml; do
            # setup-python must be v6+
            if grep -qE 'actions/setup-python@v[1-5]' "$f" 2>/dev/null; then
              echo "::warning file=$f::setup-python below v6 — update to actions/setup-python@v6"
              warnings=$((warnings + 1))
            fi

            # codecov-action must be v5+
            if grep -qE 'codecov/codecov-action@v[1-4]' "$f" 2>/dev/null; then
              echo "::warning file=$f::codecov-action below v5 — update to codecov/codecov-action@v5"
              warnings=$((warnings + 1))
            fi

            # checkout should be v6+
            if grep -qE 'actions/checkout@v[1-5]' "$f" 2>/dev/null; then
              echo "::warning file=$f::checkout below v6 — update to actions/checkout@v6"
              warnings=$((warnings + 1))
            fi

            # setup-dotnet should be v4+
            if grep -qE 'actions/setup-dotnet@v[1-3]' "$f" 2>/dev/null; then
              echo "::warning file=$f::setup-dotnet below v4 — update to actions/setup-dotnet@v4"
              warnings=$((warnings + 1))
            fi

            # setup-node should be v4+
            if grep -qE 'actions/setup-node@v[1-3]' "$f" 2>/dev/null; then
              echo "::warning file=$f::setup-node below v4 — update to actions/setup-node@v4"
              warnings=$((warnings + 1))
            fi
          done

          if [ "$warnings" -gt 0 ]; then
            echo "::warning::Found $warnings action(s) below version floor"
          else
            echo "All actions meet version floors"
          fi

      - name: Check org-level docs integrity
        shell: bash
        run: |
          echo "=== Checking required org docs ==="
          errors=0

          for doc in SUPPORT.md SECURITY.md CODE_OF_CONDUCT.md CONTRIBUTING.md LICENSE; do
            if [ ! -f "$doc" ]; then
              echo "::error::Missing required org doc: $doc"
              errors=$((errors + 1))
            else
              echo "OK: $doc exists"
            fi
          done

          # Check SUPPORT.md has Discussions links
          if [ -f "SUPPORT.md" ]; then
            if ! grep -q '/discussions' SUPPORT.md; then
              echo "::warning file=SUPPORT.md::No Discussions links found — add repo discussion URLs"
            else
              count=$(grep -c '/discussions' SUPPORT.md)
              echo "OK: SUPPORT.md contains $count Discussions links"
            fi
          fi

          # Check brand kit exists
          for doc in brand/README.md brand/palette.md brand/og/manifest.json; do
            if [ ! -f "$doc" ]; then
              echo "::warning::Missing brand asset: $doc"
              errors=$((errors + 1))
            else
              echo "OK: $doc exists"
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo "::error::Found $errors missing doc(s)"
            exit 1
          fi

      - name: Check release policy docs
        shell: bash
        run: |
          echo "=== Checking release policy docs ==="
          for doc in docs/RELEASING.md docs/VERSIONING.md docs/MAINTENANCE.md docs/BRANCH_POLICY.md docs/BADGES.md; do
            if [ ! -f "$doc" ]; then
              echo "::warning::Missing release doc: $doc"
            else
              echo "OK: $doc exists"
            fi
          done

  check-org-repos:
    name: Scan Org Repos (Cross-Repo)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_GUARD_TOKEN != '' && secrets.ORG_GUARD_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Scan all org repos for regressions
        id: scan
        shell: bash
        run: |
          set -uo pipefail

          ORG="mcp-tool-shop-org"
          fail=0
          findings="$RUNNER_TEMP/org_guard_findings.md"
          echo "# Org Guard Findings" > "$findings"
          echo "" >> "$findings"

          # Fetch all non-archived repos (single paginated call, reuse JSON)
          repos_json="$(gh api -H "Accept: application/vnd.github+json" \
            "/orgs/${ORG}/repos?per_page=100&type=all" --paginate)"
          repos="$(echo "$repos_json" | jq -r '.[] | select(.archived == false) | .name' | sort)"

          repo_count=$(echo "$repos" | wc -l)
          echo "Scanning $repo_count non-archived repos..."

          for repo in $repos; do
            echo ""
            echo "==> $repo"

            # --- 1. Default branch must be main ---
            default_branch="$(echo "$repos_json" | jq -r --arg r "$repo" \
              '.[] | select(.name==$r) | .default_branch')"
            if [[ "$default_branch" != "main" ]]; then
              echo "::error::$repo — default branch is '$default_branch' (expected 'main')"
              echo "- :x: **$repo** default branch is \`$default_branch\` (expected \`main\`)." >> "$findings"
              fail=1
            fi

            # --- 2. Stale master branch ---
            if gh api "repos/${ORG}/${repo}/branches/master" --jq '.name' 2>/dev/null | grep -q master; then
              echo "::warning::$repo — stale 'master' branch exists alongside '$default_branch'"
              echo "- :warning: **$repo** stale \`master\` branch exists alongside \`$default_branch\`." >> "$findings"
              fail=1
            fi

            # --- 3. README: branch=master or /master/ in URLs ---
            # Use /readme endpoint (handles README.rst, README.adoc, etc.)
            readme_b64="$(gh api "repos/${ORG}/${repo}/readme" --jq '.content' 2>/dev/null | tr -d '\n')" || true
            if [[ -n "$readme_b64" ]]; then
              readme="$(printf "%s" "$readme_b64" | base64 -d 2>/dev/null || true)"
              if echo "$readme" | grep -qE 'branch=master|/actions/workflows/[^)]*\?branch=master'; then
                echo "::warning::$repo — README contains branch=master in badge URL"
                echo "- :warning: **$repo** README contains \`branch=master\` in badge URL." >> "$findings"
                fail=1
              fi
            fi

            # --- 4. Workflow files: master triggers + action floors ---
            wf_list="$(gh api "repos/${ORG}/${repo}/contents/.github/workflows" \
              --jq '.[] | select(.type=="file") | select(.name | test("\\.ya?ml$")) | .path' 2>/dev/null)" || true
            [[ -z "$wf_list" ]] && continue

            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              f="$(basename "$path")"

              wf_b64="$(gh api "repos/${ORG}/${repo}/contents/${path}" --jq '.content' 2>/dev/null | tr -d '\n')" || true
              [[ -z "$wf_b64" ]] && continue
              wf="$(printf "%s" "$wf_b64" | base64 -d 2>/dev/null || true)"
              [[ -z "$wf" ]] && continue

              # Master branch triggers
              if echo "$wf" | grep -qE 'branches:\s*\[.*master'; then
                echo "::warning::$repo/$f — workflow triggers on 'master'"
                echo "- :warning: **$repo** \`$f\` triggers on \`master\`." >> "$findings"
                fail=1
              fi

              # Action pinned to @master (supply chain risk)
              # Match @master at end of line or followed by quote/whitespace
              if echo "$wf" | grep -qE '@master["[:space:]]|@master$'; then
                echo "::warning::$repo/$f — action pinned to @master (supply chain risk)"
                echo "- :warning: **$repo** \`$f\` uses an action pinned to \`@master\`." >> "$findings"
                fail=1
              fi

              # Version floors (match @vN but not @vNN, e.g. @v5 but not @v50)
              if echo "$wf" | grep -qE 'actions/setup-python@v[1-5][^0-9]'; then
                echo "::warning::$repo/$f — setup-python below v6"
                echo "- :warning: **$repo** \`$f\` uses \`setup-python\` below v6." >> "$findings"
                fail=1
              fi

              if echo "$wf" | grep -qE 'codecov/codecov-action@v[1-4][^0-9]'; then
                echo "::warning::$repo/$f — codecov-action below v5"
                echo "- :warning: **$repo** \`$f\` uses \`codecov-action\` below v5." >> "$findings"
                fail=1
              fi
            done <<< "$wf_list"
          done

          # --- Summary ---
          echo "" >> "$findings"
          if [[ "$fail" -eq 1 ]]; then
            echo "## Status: FAIL" >> "$findings"
            echo "Found regressions. Fix and re-run org-guard." >> "$findings"
          else
            echo "## Status: PASS" >> "$findings"
            echo "No regressions detected across $repo_count repos." >> "$findings"
          fi

          echo "----"
          cat "$findings"
          echo "----"

          exit "$fail"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          findings="$RUNNER_TEMP/org_guard_findings.md"
          if [[ -f "$findings" ]]; then
            cat "$findings" >> "$GITHUB_STEP_SUMMARY"
          fi

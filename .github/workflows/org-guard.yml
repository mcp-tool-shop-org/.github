name: Org Drift Guard

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  check-org-standards:
    name: Check Org Standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check for forbidden 'master' branch references in workflows
        shell: bash
        run: |
          echo "=== Checking for 'master' branch references in .github repo workflows ==="
          violations=0

          for f in .github/workflows/*.yml; do
            # Skip this workflow itself
            [ "$(basename "$f")" = "org-guard.yml" ] && continue

            if grep -n 'branches:.*master' "$f" 2>/dev/null; then
              echo "::warning file=$f::Found 'master' branch reference — use 'main' instead"
              violations=$((violations + 1))
            fi
          done

          if [ "$violations" -gt 0 ]; then
            echo "::warning::Found $violations workflow(s) referencing 'master' branch"
          else
            echo "All workflows use 'main' branch references"
          fi

      - name: Check action version floors
        shell: bash
        run: |
          echo "=== Checking action version floors ==="
          warnings=0

          for f in .github/workflows/*.yml; do
            # setup-python must be v6+
            if grep -qE 'actions/setup-python@v[1-5]' "$f" 2>/dev/null; then
              echo "::warning file=$f::setup-python below v6 — update to actions/setup-python@v6"
              warnings=$((warnings + 1))
            fi

            # codecov-action must be v5+
            if grep -qE 'codecov/codecov-action@v[1-4]' "$f" 2>/dev/null; then
              echo "::warning file=$f::codecov-action below v5 — update to codecov/codecov-action@v5"
              warnings=$((warnings + 1))
            fi

            # checkout should be v6+
            if grep -qE 'actions/checkout@v[1-5]' "$f" 2>/dev/null; then
              echo "::warning file=$f::checkout below v6 — update to actions/checkout@v6"
              warnings=$((warnings + 1))
            fi

            # setup-dotnet should be v4+
            if grep -qE 'actions/setup-dotnet@v[1-3]' "$f" 2>/dev/null; then
              echo "::warning file=$f::setup-dotnet below v4 — update to actions/setup-dotnet@v4"
              warnings=$((warnings + 1))
            fi

            # setup-node should be v4+
            if grep -qE 'actions/setup-node@v[1-3]' "$f" 2>/dev/null; then
              echo "::warning file=$f::setup-node below v4 — update to actions/setup-node@v4"
              warnings=$((warnings + 1))
            fi
          done

          if [ "$warnings" -gt 0 ]; then
            echo "::warning::Found $warnings action(s) below version floor"
          else
            echo "All actions meet version floors"
          fi

      - name: Check org-level docs integrity
        shell: bash
        run: |
          echo "=== Checking required org docs ==="
          errors=0

          for doc in SUPPORT.md SECURITY.md CODE_OF_CONDUCT.md CONTRIBUTING.md LICENSE; do
            if [ ! -f "$doc" ]; then
              echo "::error::Missing required org doc: $doc"
              errors=$((errors + 1))
            else
              echo "OK: $doc exists"
            fi
          done

          # Check SUPPORT.md has Discussions links
          if [ -f "SUPPORT.md" ]; then
            if ! grep -q '/discussions' SUPPORT.md; then
              echo "::warning file=SUPPORT.md::No Discussions links found — add repo discussion URLs"
            else
              count=$(grep -c '/discussions' SUPPORT.md)
              echo "OK: SUPPORT.md contains $count Discussions links"
            fi
          fi

          # Check brand kit exists
          for doc in brand/README.md brand/palette.md brand/og/manifest.json; do
            if [ ! -f "$doc" ]; then
              echo "::warning::Missing brand asset: $doc"
              errors=$((errors + 1))
            else
              echo "OK: $doc exists"
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo "::error::Found $errors missing doc(s)"
            exit 1
          fi

      - name: Check release policy docs
        shell: bash
        run: |
          echo "=== Checking release policy docs ==="
          for doc in docs/RELEASING.md docs/VERSIONING.md docs/MAINTENANCE.md docs/BRANCH_POLICY.md docs/BADGES.md; do
            if [ ! -f "$doc" ]; then
              echo "::warning::Missing release doc: $doc"
            else
              echo "OK: $doc exists"
            fi
          done

  check-org-repos:
    name: Check Org Repos (Cross-Repo)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Scan repos for master branch references
        shell: bash
        run: |
          echo "=== Scanning org repos for master branch regressions ==="
          violations=0

          # Get non-archived repos
          repos=$(gh api orgs/mcp-tool-shop-org/repos --paginate \
            --jq '.[] | select(.archived == false) | .name' | sort)

          for repo in $repos; do
            # Check if master branch still exists
            if gh api "repos/mcp-tool-shop-org/$repo/branches/master" --jq '.name' 2>/dev/null | grep -q master; then
              default=$(gh api "repos/mcp-tool-shop-org/$repo" --jq '.default_branch' 2>/dev/null)
              if [ "$default" = "master" ]; then
                echo "::error::$repo — default branch is still 'master'"
              else
                echo "::warning::$repo — stale 'master' branch exists alongside '$default'"
              fi
              violations=$((violations + 1))
            fi
          done

          echo "---"
          if [ "$violations" -gt 0 ]; then
            echo "::warning::Found $violations repo(s) with master branch issues"
          else
            echo "All repos use 'main' — no master branches found"
          fi

      - name: Scan README badges for master references
        shell: bash
        run: |
          echo "=== Scanning README badges for branch=master ==="
          violations=0

          repos=$(gh api orgs/mcp-tool-shop-org/repos --paginate \
            --jq '.[] | select(.archived == false) | .name' | sort)

          for repo in $repos; do
            readme=$(gh api "repos/mcp-tool-shop-org/$repo/contents/README.md" \
              --jq '.content' 2>/dev/null | base64 -d 2>/dev/null)
            [ -z "$readme" ] && continue

            if echo "$readme" | grep -qiE 'branch=master|/master/'; then
              echo "::warning::$repo — README contains master branch reference in badge or URL"
              violations=$((violations + 1))
            fi
          done

          echo "---"
          if [ "$violations" -gt 0 ]; then
            echo "::warning::Found $violations repo(s) with master references in READMEs"
          else
            echo "All README badges use 'main'"
          fi

      - name: Scan workflows for master triggers
        shell: bash
        run: |
          echo "=== Scanning workflows for master branch triggers ==="
          violations=0

          repos=$(gh api orgs/mcp-tool-shop-org/repos --paginate \
            --jq '.[] | select(.archived == false) | .name' | sort)

          for repo in $repos; do
            files=$(gh api "repos/mcp-tool-shop-org/$repo/contents/.github/workflows" \
              --jq '.[].name' 2>/dev/null)
            [ -z "$files" ] && continue

            for f in $files; do
              content=$(gh api "repos/mcp-tool-shop-org/$repo/contents/.github/workflows/$f" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null)
              [ -z "$content" ] && continue

              if echo "$content" | grep -qE 'branches:.*master'; then
                echo "::warning::$repo/.github/workflows/$f — workflow triggers on 'master'"
                violations=$((violations + 1))
              fi
            done
          done

          echo "---"
          if [ "$violations" -gt 0 ]; then
            echo "::warning::Found $violations workflow(s) triggering on master"
          else
            echo "All workflows trigger on 'main' only"
          fi

      - name: Check action version floors across org
        shell: bash
        run: |
          echo "=== Checking action version floors across org ==="
          violations=0

          repos=$(gh api orgs/mcp-tool-shop-org/repos --paginate \
            --jq '.[] | select(.archived == false) | .name' | sort)

          for repo in $repos; do
            files=$(gh api "repos/mcp-tool-shop-org/$repo/contents/.github/workflows" \
              --jq '.[].name' 2>/dev/null)
            [ -z "$files" ] && continue

            for f in $files; do
              content=$(gh api "repos/mcp-tool-shop-org/$repo/contents/.github/workflows/$f" \
                --jq '.content' 2>/dev/null | base64 -d 2>/dev/null)
              [ -z "$content" ] && continue

              if echo "$content" | grep -qE 'codecov/codecov-action@v[1-4]'; then
                echo "::warning::$repo/$f — codecov-action below v5"
                violations=$((violations + 1))
              fi

              if echo "$content" | grep -qE 'actions/setup-python@v[1-5]'; then
                echo "::warning::$repo/$f — setup-python below v6"
                violations=$((violations + 1))
              fi

              if echo "$content" | grep -qE '@master\b'; then
                echo "::warning::$repo/$f — action pinned to @master (supply chain risk)"
                violations=$((violations + 1))
              fi
            done
          done

          echo "---"
          if [ "$violations" -gt 0 ]; then
            echo "::warning::Found $violations action version floor violation(s)"
          else
            echo "All actions meet version floors"
          fi

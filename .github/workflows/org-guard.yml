name: Org Drift Guard

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  check-org-standards:
    name: Check Org Standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check for forbidden 'master' branch references in workflows
        shell: bash
        run: |
          echo "=== Checking for 'master' branch references in .github repo workflows ==="
          violations=0

          for f in .github/workflows/*.yml; do
            # Skip this workflow itself
            [ "$(basename "$f")" = "org-guard.yml" ] && continue

            if grep -n 'branches:.*master' "$f" 2>/dev/null; then
              echo "::warning file=$f::Found 'master' branch reference — use 'main' instead"
              violations=$((violations + 1))
            fi
          done

          if [ "$violations" -gt 0 ]; then
            echo "::warning::Found $violations workflow(s) referencing 'master' branch"
          else
            echo "All workflows use 'main' branch references"
          fi

      - name: Check action version floors
        shell: bash
        run: |
          echo "=== Checking action version floors ==="
          warnings=0

          for f in .github/workflows/*.yml; do
            # setup-python must be v6+
            if grep -qE 'actions/setup-python@v[1-5]' "$f" 2>/dev/null; then
              echo "::warning file=$f::setup-python below v6 — update to actions/setup-python@v6"
              warnings=$((warnings + 1))
            fi

            # codecov-action must be v5+
            if grep -qE 'codecov/codecov-action@v[1-4]' "$f" 2>/dev/null; then
              echo "::warning file=$f::codecov-action below v5 — update to codecov/codecov-action@v5"
              warnings=$((warnings + 1))
            fi

            # checkout should be v6+
            if grep -qE 'actions/checkout@v[1-5]' "$f" 2>/dev/null; then
              echo "::warning file=$f::checkout below v6 — update to actions/checkout@v6"
              warnings=$((warnings + 1))
            fi

            # setup-dotnet should be v4+
            if grep -qE 'actions/setup-dotnet@v[1-3]' "$f" 2>/dev/null; then
              echo "::warning file=$f::setup-dotnet below v4 — update to actions/setup-dotnet@v4"
              warnings=$((warnings + 1))
            fi

            # setup-node should be v4+
            if grep -qE 'actions/setup-node@v[1-3]' "$f" 2>/dev/null; then
              echo "::warning file=$f::setup-node below v4 — update to actions/setup-node@v4"
              warnings=$((warnings + 1))
            fi
          done

          if [ "$warnings" -gt 0 ]; then
            echo "::warning::Found $warnings action(s) below version floor"
          else
            echo "All actions meet version floors"
          fi

      - name: Check org-level docs integrity
        shell: bash
        run: |
          echo "=== Checking required org docs ==="
          errors=0

          for doc in SUPPORT.md SECURITY.md CODE_OF_CONDUCT.md CONTRIBUTING.md LICENSE; do
            if [ ! -f "$doc" ]; then
              echo "::error::Missing required org doc: $doc"
              errors=$((errors + 1))
            else
              echo "OK: $doc exists"
            fi
          done

          # Check SUPPORT.md has Discussions links
          if [ -f "SUPPORT.md" ]; then
            if ! grep -q '/discussions' SUPPORT.md; then
              echo "::warning file=SUPPORT.md::No Discussions links found — add repo discussion URLs"
            else
              count=$(grep -c '/discussions' SUPPORT.md)
              echo "OK: SUPPORT.md contains $count Discussions links"
            fi
          fi

          # Check brand kit exists
          for doc in brand/README.md brand/palette.md brand/og/manifest.json; do
            if [ ! -f "$doc" ]; then
              echo "::warning::Missing brand asset: $doc"
              errors=$((errors + 1))
            else
              echo "OK: $doc exists"
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo "::error::Found $errors missing doc(s)"
            exit 1
          fi

      - name: Check release policy docs
        shell: bash
        run: |
          echo "=== Checking release policy docs ==="
          for doc in docs/RELEASING.md docs/VERSIONING.md docs/MAINTENANCE.md; do
            if [ ! -f "$doc" ]; then
              echo "::warning::Missing release doc: $doc"
            else
              echo "OK: $doc exists"
            fi
          done
